<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6941b6"><title>Jogo da Velha Online</title><style>
*{box-sizing:border-box}body{font:16px system-ui,sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);margin:0;min-height:100dvh;display:grid;place-items:center;color:#29233b;padding:16px}.card{background:white;border-radius:20px;padding:clamp(20px,5vw,36px);width:min(100%,520px);box-shadow:0 12px 35px #20153755;text-align:center}h1{color:#7046a9;margin:0 0 10px}p{line-height:1.4}.stack{display:grid;gap:12px;margin-top:20px}button,input{font:inherit;border-radius:10px;padding:13px;border:1px solid #c6bfd2}button{color:white;background:#7046a9;border:0;font-weight:700;cursor:pointer}button:hover{background:#593389}button:disabled{opacity:.55;cursor:not-allowed}.secondary{background:#536aa8}.light{background:#eee9f7;color:#503477}.hidden{display:none!important}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(100%,300px);margin:20px auto}.cell{aspect-ratio:1;background:#eee9f7;color:#7046a9;font-size:clamp(32px,10vw,52px);padding:0}.cell:hover{background:#e3d9f1}.cell:disabled{opacity:1;color:#7046a9}.error{color:#a11c36;font-weight:600;overflow-wrap:anywhere}.small{font-size:.88rem;color:#605b6b;overflow-wrap:anywhere}input{width:100%;min-width:0}#status{font-weight:700;color:#563384;min-height:1.5em}
</style></head><body><main class="card"><h1>⭕ Jogo da Velha ❌</h1><p>Jogue contra o computador ou convide alguém para uma partida online.</p><div id="error" class="error" role="alert"></div><section id="menu"><div class="stack"><button id="computer">🤖 Jogar com a máquina</button><button id="online">🌐 Jogar online</button></div></section><section id="lobby" class="hidden"><div class="stack"><button id="create">Criar sala</button><div>ou entre com o código da sala:</div><input id="code" placeholder="Cole o código ou o link" autocomplete="off"><button class="secondary" id="join">Entrar na sala</button><button class="light" data-home>Voltar</button></div></section><section id="game" class="hidden"><p id="status" aria-live="polite"></p><div id="share" class="hidden"><p class="small">Envie este link ao seu adversário:</p><input id="link" readonly aria-label="Link da sala"><div class="stack"><button id="copy" class="secondary">Copiar convite</button></div><p id="roomcode" class="small"></p></div><div class="board" id="board" aria-label="Tabuleiro"></div><div class="stack"><button id="reset" class="secondary hidden">Jogar novamente</button><button class="light" data-home>Sair para o menu</button></div></section></main>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import { getFirestore, doc, getDoc, setDoc, runTransaction, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
const app=initializeApp({apiKey:'AIzaSyDx7xjvl-XNeO24f5SORPXju8Ry4W3CXk4',authDomain:'jogo-da-velha-online-647c1.firebaseapp.com',projectId:'jogo-da-velha-online-647c1',storageBucket:'jogo-da-velha-online-647c1.firebasestorage.app',messagingSenderId:'760654182894',appId:'1:760654182894:web:c7dcac024e99300d1036ff'});
const auth=getAuth(app), db=getFirestore(app), keys='abcdefghi'.split(''), blank=()=>Object.fromEntries(keys.map(k=>[k,'']));
const $=id=>document.getElementById(id); let mode='', room='', unsubscribe=null, data=null, busy=false, aiTimer=null;
const wins=['abc','def','ghi','adg','beh','cfi','aei','ceg'];
function outcome(b){for(const p of wins)if(b[p[0]]&&b[p[0]]===b[p[1]]&&b[p[1]]===b[p[2]])return b[p[0]];return keys.every(k=>b[k])?'draw':''}
function error(e){console.error(e);$('error').textContent=typeof e==='string'?e:'Não foi possível concluir. Confira sua conexão e tente novamente.'}
function screen(id){for(const s of ['menu','lobby','game'])$(s).classList.toggle('hidden',s!==id);$('error').textContent=''}
function home(){if(unsubscribe)unsubscribe();unsubscribe=null;if(aiTimer)clearTimeout(aiTimer);data=null;room='';mode='';history.replaceState(null,'',location.pathname);screen('menu')}
document.querySelectorAll('[data-home]').forEach(el=>el.onclick=home);
function render(){if(!data)return;let b=data.board, result=outcome(b), mine=mode==='computer'?'X':data.host===auth.currentUser?.uid?'X':data.guest===auth.currentUser?.uid?'O':'';let waiting=mode==='online'&&!data.guest;
$('status').textContent=waiting?'Aguardando o adversário entrar…':result==='draw'?'Empate!':result?`${result} venceu!`:mode==='computer'?(data.turn==='X'?'Sua vez (X)':'Vez da máquina (O)'):`Você é ${mine}. ${data.turn===mine?'Sua vez!':'Vez do adversário.'}`;
$('share').classList.toggle('hidden',mode!=='online');$('reset').classList.toggle('hidden',!result);$('board').replaceChildren();for(const k of keys){let btn=document.createElement('button');btn.className='cell';btn.textContent=b[k];btn.setAttribute('aria-label',`Casa ${keys.indexOf(k)+1}: ${b[k]||'vazia'}`);btn.disabled=!!b[k]||!!result||waiting||busy||data.turn!==mine;btn.onclick=()=>play(k);$('board').append(btn)}}
async function ready(){if(auth.currentUser)return auth.currentUser;return new Promise((resolve,reject)=>{let stop=onAuthStateChanged(auth,u=>{stop();if(u)resolve(u);else signInAnonymously(auth).then(c=>resolve(c.user)).catch(reject)},reject)})}
$('computer').onclick=()=>{mode='computer';data={board:blank(),turn:'X'};screen('game');render()};$('online').onclick=()=>screen('lobby');
$('create').onclick=async()=>{if(busy)return;busy=true;try{await ready();let bytes=crypto.getRandomValues(new Uint8Array(16));room=Array.from(bytes,x=>x.toString(16).padStart(2,'0')).join('');let ref=doc(db,'rooms',room);await setDoc(ref,{host:auth.currentUser.uid,guest:'',board:blank(),turn:'X',move:''});watch();}catch(e){error(e)}finally{busy=false;render()}};
$('join').onclick=async()=>{if(busy)return;let c=$('code').value.trim();try{if(c.includes('?'))c=new URL(c).searchParams.get('sala')||''}catch{}if(!/^[0-9a-f]{32}$/.test(c)){error('Código inválido. Cole o convite completo ou o código da sala.');return}busy=true;try{await ready();room=c;let ref=doc(db,'rooms',room);await runTransaction(db,async t=>{let snap=await t.get(ref);if(!snap.exists())throw new Error('Sala não encontrada.');let d=snap.data();if(d.host===auth.currentUser.uid||d.guest===auth.currentUser.uid)return;if(d.guest)throw new Error('Esta sala já está cheia.');t.update(ref,{guest:auth.currentUser.uid})});watch()}catch(e){error(e.message==='Sala não encontrada.'||e.message==='Esta sala já está cheia.'?e.message:e)}finally{busy=false;render()}};
function watch(){mode='online';screen('game');let url=new URL(location.href);url.search='';url.searchParams.set('sala',room);$('link').value=url.href;$('roomcode').textContent='Código: '+room;unsubscribe=onSnapshot(doc(db,'rooms',room),snap=>{if(!snap.exists()){error('Sala não encontrada.');return}data=snap.data();render()},error)}
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('link').value);$('copy').textContent='Convite copiado!';setTimeout(()=>$('copy').textContent='Copiar convite',2000)}catch{$('link').select();error('Selecione e copie o link acima.')}};
async function play(k){if(busy||!data||data.board[k]||outcome(data.board))return;if(mode==='computer'){if(data.turn!=='X')return;data.board[k]='X';data.turn='O';render();if(!outcome(data.board))aiTimer=setTimeout(()=>{if(mode!=='computer'||!data)return;let b=data.board, empty=keys.filter(i=>!b[i]), pick=null;for(const mark of ['O','X']){for(const i of empty){b[i]=mark;let won=outcome(b)===mark;b[i]='';if(won){pick=i;break}}if(pick)break}pick=pick||(b.e===''?'e':empty[Math.floor(Math.random()*empty.length)]);b[pick]='O';data.turn='X';render()},350);return}
busy=true;render();try{let ref=doc(db,'rooms',room);await runTransaction(db,async t=>{let s=await t.get(ref);if(!s.exists())throw Error('Sala inexistente');let d=s.data(),mine=d.host===auth.currentUser.uid?'X':d.guest===auth.currentUser.uid?'O':'';if(!d.guest||d.turn!==mine||d.board[k]||outcome(d.board))throw Error('Jogada indisponível');t.update(ref,{board:{...d.board,[k]:mine},turn:mine==='X'?'O':'X',move:k})})}catch(e){error(e)}finally{busy=false;render()}}
$('reset').onclick=async()=>{if(mode==='computer'){data={board:blank(),turn:'X'};render();return}if(busy)return;busy=true;try{let ref=doc(db,'rooms',room);await runTransaction(db,async t=>{let s=await t.get(ref);if(s.exists()&&outcome(s.data().board))t.update(ref,{board:blank(),turn:'X',move:''})})}catch(e){error(e)}finally{busy=false;render()}};
let invite=new URL(location.href).searchParams.get('sala');if(invite){screen('lobby');$('code').value=invite}
</script></body></html>
